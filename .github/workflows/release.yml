# A ogni push su `main`: verifica (fmt, clippy, test), compila `hyper.exe`
# in release, crea `HyperLauncher-Setup.exe` con Inno Setup e lo pubblica
# nella release `v<versione del workspace>`. Finché la versione in
# Cargo.toml non cambia, la stessa release viene aggiornata con il setup
# dell'ultimo commit; cambiando versione si crea una nuova release.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p hyper-cli

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\hyper-launcher.iss

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          notes="Setup Windows compilato dal commit ${GITHUB_SHA::7} di main.

          Installa \`hyper\` in %LOCALAPPDATA%\\Programs\\HyperLauncher e lo aggiunge al PATH (non servono permessi di amministratore). Il file non è firmato: Windows SmartScreen può chiedere conferma (\"Ulteriori informazioni\" → \"Esegui comunque\")."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/HyperLauncher-Setup.exe --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" dist/HyperLauncher-Setup.exe \
              --title "Hyper Launcher $TAG" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi
