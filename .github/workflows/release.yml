# A ogni push su `main`: verifica (fmt, clippy, test), compila `hyper.exe`
# in release, crea `HyperLauncher-Setup.exe` con Inno Setup e lo pubblica
# in una nuova release `build-<N>` (N = numero progressivo del run), marcata
# come "latest". Il launcher installato confronta il proprio numero di build
# con quello dell'ultima release e, se è più vecchio, si aggiorna da solo.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-setup:
    runs-on: windows-latest
    env:
      # Incorporati nel binario: abilitano l'aggiornamento automatico.
      HYPER_BUILD: ${{ github.run_number }}
      HYPER_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p hyper-cli

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DBuild=${{ github.run_number }}" installer\hyper-launcher.iss

      - name: Hash
        shell: bash
        run: sha1sum dist/HyperLauncher-Setup.exe | cut -d' ' -f1 > dist/HyperLauncher-Setup.exe.sha1

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="Setup Windows compilato dal commit ${GITHUB_SHA::7} di main.

          Installa \`hyper\` in %LOCALAPPDATA%\\Programs\\HyperLauncher e lo aggiunge al PATH (non servono permessi di amministratore). Le installazioni esistenti si aggiornano da sole all'avvio di \`hyper\`.

          Il file non è firmato: Windows SmartScreen può chiedere conferma (\"Ulteriori informazioni\" → \"Esegui comunque\")."
          gh release create "$TAG" dist/HyperLauncher-Setup.exe dist/HyperLauncher-Setup.exe.sha1 \
            --title "Hyper Launcher $VERSION (build ${{ github.run_number }})" \
            --notes "$notes" --target "$GITHUB_SHA" --latest
