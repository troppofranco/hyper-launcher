[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
hyper-core = { path = "crates/core" }
hyper-auth = { path = "crates/auth" }
hyper-installer = { path = "crates/installer" }
hyper-instances = { path = "crates/instances" }

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
futures = "0.3"
hex = "0.4"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "json", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
