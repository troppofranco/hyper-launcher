[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hyper-core = { path = "crates/core" }
hyper-auth = { path = "crates/auth" }
hyper-installer = { path = "crates/installer" }
hyper-instances = { path = "crates/instances" }
hyper-content = { path = "crates/content" }
hyper-sync = { path = "crates/sync" }
hyper-server = { path = "crates/server" }
hyper-bedrock = { path = "crates/bedrock" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
fastnbt = "2"
futures = "0.3"
hex = "0.4"
keyring = "4"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "form", "http2", "json", "query", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "time", "sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
wiremock = "0.6"
zeroize = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
